name: Build Windows Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build Laminari Launcher
        run: npm run build

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LaminariLauncher-Windows
          path: src-tauri/target/release/laminari_launcher.exe
          if-no-files-found: error
