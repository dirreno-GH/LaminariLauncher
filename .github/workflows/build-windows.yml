name: Build Windows Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build Laminari Launcher
        run: npm run build

      - name: Prepare release file
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/laminari_launcher.exe" "LaminariLauncher.exe" -Force
          $version = (Get-Content "package.json" | ConvertFrom-Json).version
          "LAMINARI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LaminariLauncher-Windows
          path: LaminariLauncher.exe
          if-no-files-found: error

      - name: Publish launcher to Cloudflare
        shell: pwsh
        run: |
          $headers = @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $oidc = Invoke-RestMethod -Headers $headers -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=laminari-launcher-upload"
          curl.exe --silent --show-error --fail-with-body --retry 3 -X PUT -H "Authorization: Bearer $($oidc.value)" -H "Content-Type: application/vnd.microsoft.portable-executable" -H "X-GitHub-SHA: $env:GITHUB_SHA" -H "X-Launcher-Version: $env:LAMINARI_VERSION" --data-binary "@LaminariLauncher.exe" "https://laminari-client.laminari.workers.dev/api/launcher/upload"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:LAMINARI_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "LaminariLauncher.exe" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Laminari Launcher $env:LAMINARI_VERSION" --notes "Windows x64 release of Laminari Launcher." --latest
          } else {
            gh release upload $tag "LaminariLauncher.exe" --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --latest
          }
